<!DOCTYPE html>
<html>
<head>
    <title>Keylogger Demo</title>
</head>
<body>

<h2>Keylogger Demo</h2>

<input type="text" id="inputBox" placeholder="Type here...">

<p>Captured Keys:</p>
<p id="output"></p>

<script>
    let log = "";

    document.getElementById("inputBox").addEventListener("keypress", function(event) {
        log += event.key;
        document.getElementById("output").innerText = log;
    });
</script>
<!--
Implications for Security:
This example clearly shows how a keylogger records all the keystrokes made by the user.
It means that an attacker can steal confidential data such as passwords,
credit card numbers, and private messages.
-->
</body>
</html>
